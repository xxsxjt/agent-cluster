server {
    listen 80;
    listen [::]:80;
    server_name share.xxssxx.top;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name share.xxssxx.top;

    ssl_certificate     /etc/letsencrypt/live/share.xxssxx.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/share.xxssxx.top/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL_SHARE:10m;

    root /var/www/xxsx-share;
    index index.html;
    charset utf-8;

    add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https://icons.duckduckgo.com; style-src 'self'; script-src 'self' https://static.cloudflareinsights.com; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'; upgrade-insecure-requests" always;

    # ── JWT login gate (v2 2026-08-12): full-site auth via games-api verify ──
    # verify 端点校验 .xxssxx.top 域 xxsx-session cookie，未登录返回 401
    location = /_auth_verify {
        internal;
        proxy_pass http://127.0.0.1:8787/games-api/auth/verify;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Host share.xxssxx.top;
        proxy_set_header X-Original-URI $request_uri;
        proxy_read_timeout 5s;
    }

    location @login_redirect {
        return 302 https://xxssxx.top/?login=1&next=$scheme://$host$request_uri;
    }

    # ── Protected pages & data (all share content requires login) ────────────
    # no-store：防止 CDN 缓存绕过登录保护
    location = / {
        auth_request /_auth_verify;
        error_page 401 = @login_redirect;
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    location = /index.html {
        auth_request /_auth_verify;
        error_page 401 = @login_redirect;
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    location ^~ /api/ {
        auth_request /_auth_verify;
        error_page 401 = @login_redirect;
        add_header Cache-Control "no-store" always;
        try_files $uri $uri/ =404;
    }

    location ^~ /servers/ {
        auth_request /_auth_verify;
        error_page 401 = @login_redirect;
        add_header Cache-Control "no-store" always;
        try_files $uri $uri/ =404;
    }

    location ^~ /tools/ {
        auth_request /_auth_verify;
        error_page 401 = @login_redirect;
        add_header Cache-Control "no-store" always;
        try_files $uri $uri/ =404;
    }

    location ^~ /guides/ {
        auth_request /_auth_verify;
        error_page 401 = @login_redirect;
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    location = /feedback.html {
        auth_request /_auth_verify;
        error_page 401 = @login_redirect;
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    # ── Data files (site lists) stay behind the gate ────────────────────────
    location ^~ /assets/data/ {
        auth_request /_auth_verify;
        error_page 401 = @login_redirect;
        add_header Cache-Control "no-store" always;
        expires epoch;
        try_files $uri =404;
    }

    # ── API endpoints (PHP) ──────────────────────────────────────────────────
    location = /api/feedback.php {
        auth_request /_auth_verify;
        error_page 401 = @login_redirect;
        limit_req zone=xxsx_auth_rate burst=5 nodelay;
        client_max_body_size 16k;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/xxsx-share/api/feedback.php;
        fastcgi_param HTTPS on;
        fastcgi_param HTTP_PROXY "";
        fastcgi_pass unix:/run/php-fpm/www.sock;
        fastcgi_read_timeout 15s;
        fastcgi_hide_header X-Powered-By;
    }

    location = /api/codexradar-iq.php {
        auth_request /_auth_verify;
        error_page 401 = @login_redirect;
        limit_req zone=xxsx_auth_rate burst=10 nodelay;
        client_max_body_size 8k;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/xxsx-share/api/codexradar-iq.php;
        fastcgi_param HTTPS on;
        fastcgi_param HTTP_PROXY "";
        fastcgi_pass unix:/run/php-fpm/www.sock;
        fastcgi_read_timeout 15s;
        fastcgi_hide_header X-Powered-By;
    }

    location ~ \.php(?:/|$) {
        return 404;
    }

    # ── Static assets (styles/scripts/images) stay public for page rendering ─
    location = /assets/css/site.css {
        expires epoch;
        try_files $uri =404;
    }

    location ~* ^/assets/js/(?:common|api-list|api-detail|feedback|server-list|site|pricing|codexradar-iq)\.js$ {
        expires epoch;
        try_files $uri =404;
    }

    location ~* \.(?:css|js|png|jpg|jpeg|gif|ico|svg|webp|woff2?)$ {
        expires 7d;
        try_files $uri =404;
    }

    location / {
        return 404;
    }

    location ~ /\. {
        deny all;
    }

    access_log /var/log/nginx/share.xxssxx.top.access.log main;
    error_log  /var/log/nginx/share.xxssxx.top.error.log warn;
}