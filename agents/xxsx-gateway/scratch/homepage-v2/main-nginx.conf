server {
    listen 80;
    listen [::]:80;
    server_name xxssxx.top;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name xxssxx.top;

    ssl_certificate     /etc/letsencrypt/live/xxssxx.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xxssxx.top/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL_ROOT:10m;

    root /var/www/xxsx-main;
    index index.html;
    charset utf-8;

    add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self' https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'; upgrade-insecure-requests" always;

    location = /kecheng {
        return 410;
    }

    location ^~ /kecheng/ {
        return 410;
    }

    location = /effects {
        return 301 /effects/;
    }

    location ^~ /effects/ {
        proxy_pass http://103.85.21.1;
        proxy_http_version 1.1;
        proxy_set_header Host xxssxx.top;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_send_timeout 15s;
        proxy_read_timeout 30s;
        proxy_hide_header X-Powered-By;
    }

    # Retired legacy game route. Files remain on disk for rollback only.
    location ^~ /uno/ {
        return 410;
    }

    location /sell/ {
        try_files $uri $uri/ =404;
        add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' https://cdnjs.cloudflare.com; font-src 'self' data: https://cdnjs.cloudflare.com; script-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'; upgrade-insecure-requests" always;
    }

    location = /api/site-messages.php {
        limit_req zone=xxsx_auth_rate burst=10 nodelay;
        client_max_body_size 16k;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/xxsx-main/api/site-messages.php;
        fastcgi_param HTTPS on;
        fastcgi_param HTTP_PROXY "";
        fastcgi_pass unix:/run/php-fpm/www.sock;
        fastcgi_read_timeout 15s;
        fastcgi_hide_header X-Powered-By;
    }

    location ~ \.php(?:/|$) {
        return 404;
    }

    # BEGIN xxsx games
    include /etc/nginx/snippets/xxsx-games-locations.conf;
    # END xxsx games

    # NewAPI auth proxy (games auth bridge → xxssxx.top after api.xxssxx.top goes 403)
    location ^~ /api/user/ {
        limit_req zone=xxsx_auth_rate burst=30 nodelay;
        proxy_pass http://127.0.0.1:3461;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header X-Powered-By;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 30s;
    }

    location = /api/status {
        limit_req zone=xxsx_auth_rate burst=20 nodelay;
        proxy_pass http://127.0.0.1:3461;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_hide_header X-Powered-By;
        proxy_cache off;
    }

    # ── Docs site (login-gated, v2 2026-08-12) ──────────────────────────────
    # verify 端点校验 .xxssxx.top 域 xxsx-session cookie，未登录返回 401 → 302 登录页
    location = /_auth_verify {
        internal;
        proxy_pass http://127.0.0.1:8787/games-api/auth/verify;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Host xxssxx.top;
        proxy_set_header X-Original-URI $request_uri;
        proxy_read_timeout 5s;
    }

    location @login_redirect {
        return 302 https://xxssxx.top/?login=1&next=$scheme://$host$request_uri;
    }

    location ^~ /docs/ {
        auth_request /_auth_verify;
        error_page 401 = @login_redirect;
        add_header Cache-Control "no-store" always;
        try_files $uri $uri/ =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.(?:css|js|png|jpg|jpeg|gif|ico|svg|webp|woff2?)$ {
        expires 7d;
        try_files $uri =404;
    }

    location ~ /\. {
        deny all;
    }

    access_log /var/log/nginx/xxssxx.top.access.log main;
    error_log  /var/log/nginx/xxssxx.top.error.log warn;
}
